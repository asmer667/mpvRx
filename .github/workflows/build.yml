
name: Build mpvRx APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Metadata
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      # ═══════════════════════════════════════
      # تثبيت Android SDK يدوياً وتجهيز البيئة
      # ═══════════════════════════════════════
      - name: Setup Android SDK manually
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest || true
          rm tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install NDK & Platform Tools
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0"
          echo "✅ SDK Tools Installed"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (arm64-v8a Release)
        run: ./gradlew assembleStandardRelease -PtargetAbi=arm64-v8a -PenableX86=false --no-daemon --max-workers=2 --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true

      - name: Sign APK
        if: success()
        run: |
          set -e
          UNSIGNED=$(find app/build/outputs/apk/standard/release -name "*arm64-v8a*.apk" | head -1)
          [[ -z "$UNSIGNED" ]] && UNSIGNED=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "📦 Target APK for signing: $UNSIGNED"
          
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          SIGNED="final.apk"
          
          $APKSIGNER sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out $SIGNED "$UNSIGNED"
          
          mkdir -p out
          cp $SIGNED "out/mpvRx-${SHORT_SHA}-arm64-release.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mpvRx-${{ env.SHORT_SHA }}
          path: out/*.apk
          retention-days: 30
